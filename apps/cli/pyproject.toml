[project]
name = "timewatcher-cli"
version = "0.1.0"
description = "CLI-first time tracking system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.26.8"
]

[project.scripts]
timewatcher = "timewatcher_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timewatcher_cli"]
